# «Цены на продукцию»: страница загрузки программы для заказчика. Остальной сайт не затронут.
# Файлы: /srv/ceny-produkcii-web (страница, значок, установщик). Данных заказчика здесь нет.
location = /ceny {
	return 301 /ceny/;
}
location ^~ /ceny/ {
	alias /srv/ceny-produkcii-web/;
	index index.html;
	autoindex off;
	add_header Cache-Control "no-cache" always;
	add_header X-Robots-Tag "noindex" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
